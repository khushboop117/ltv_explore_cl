name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check dashboard script parses
        run: node --check web/app.js && node --check web/data.js
